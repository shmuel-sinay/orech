name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (CI artifact, expires)
        uses: actions/upload-artifact@v4
        with:
          name: orech-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "orech $TAG" \
            --notes "Automatic build from commit ${GITHUB_SHA}. Does not expire like the CI artifact above."
